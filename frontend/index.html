<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Dealership </title>
    
</head>
<body>

    <h1> Virtual Dealership Control</h1>
    <div class="sketchfab-embed-wrapper"> <iframe title="Tesla - Cybertruck" frameborder="0" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share src="https://sketchfab.com/models/5a86defda4b24836a504fe5e597fdb17/embed?autospin=1&autostart=1&preload=1&transparent=1&ui_theme=dark&dnt=1"> </iframe> </div>
    <div class="card">
        <h3>Add New Vehicle</h3>
        <form id="vehicleForm">
            <input type="text" id="title" placeholder="Vehicle Name (e.g. Tesla Model 3)" required>
            <input type="number" id="price" placeholder="Price ($)" required>
            <select id="category">
                <option value="Sedan">Sedan</option>
                <option value="SUV">SUV</option>
                <option value="Sport">Sport</option>
                <option value="Electric">Electric</option>
            </select>
            <button type="submit">Add to Inventory</button>
        </form>
    </div>

    <div class="card">
        <h3>Current Inventory</h3>
        <div id="vehicleList">Loading...</div>
    </div>

    <script>
        const API_URL = '/auth';

        async function fetchVehicles() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const container = document.getElementById('vehicleList');
            
            if (data.length === 0) {
                container.innerHTML = 'Inventory is empty.';
                return;
            }

            container.innerHTML = data.map(v => `
                <div class="vehicle-item">
                    <div>
                        <strong>${v.title}</strong> <span class="tag">${v.category}</span><br>
                        <small>$${v.price.toLocaleString()}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteVehicle('${v._id}')">Delete</button>
                </div>
            `).join('');
        }

        document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newVehicle = {
                title: document.getElementById('title').value,
                price: Number(document.getElementById('price').value),
                category: document.getElementById('category').value
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newVehicle)
            });

            if (res.ok) {
                e.target.reset();
                fetchVehicles();
            } else {
                alert('Error adding vehicle');
            }
        });

        async function deleteVehicle(id) {
            if (confirm('Are you sure?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchVehicles();
            }
        }

        fetchVehicles();
    </script>
</body>
</html>
