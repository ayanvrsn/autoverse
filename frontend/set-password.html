<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - AutoVerse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="form-container">
            <a href="index.html" class="auth-logo">
                <i class="fas fa-car-side"></i>
                AutoVerse
            </a>

            <div class="form-card">
                <div class="form-header">
                    <h2>Set a Password</h2>
                    <p>You are signed in with Google. Add a password if you want classic email login too.</p>
                </div>

                <div id="error-message" class="alert alert-danger hidden">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>

                <div id="success-message" class="alert alert-success hidden">
                    <i class="fas fa-check-circle"></i>
                    <span></span>
                </div>

                <form id="set-password-form">
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Create a password (6-20 characters)"
                            minlength="6"
                            maxlength="20"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            class="form-control"
                            placeholder="Repeat your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="set-password-btn">
                        <span>Save Password</span>
                        <i class="fas fa-lock"></i>
                    </button>
                </form>

                <button type="button" class="btn btn-outline btn-block mt-2" id="skip-btn">
                    Skip for now
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        const form = document.getElementById('set-password-form');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        const submitBtn = document.getElementById('set-password-btn');
        const skipBtn = document.getElementById('skip-btn');

        function showError(message) {
            successDiv.classList.add('hidden');
            errorDiv.querySelector('span').textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function showSuccess(message) {
            errorDiv.classList.add('hidden');
            successDiv.querySelector('span').textContent = message;
            successDiv.classList.remove('hidden');
        }

        async function ensureNeedsPassword() {
            try {
                const me = await AuthAPI.getMe();
                Auth.setUser(me);
                if (me.hasPassword) {
                    window.location.href = 'catalog.html';
                }
            } catch (error) {
                Auth.logout();
            }
        }

        ensureNeedsPassword();

        skipBtn.addEventListener('click', () => {
            window.location.href = 'catalog.html';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            if (password.length < 6 || password.length > 20) {
                showError('Password must be 6-20 characters long');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Saving...</span> <i class="fas fa-spinner fa-spin"></i>';

            try {
                const data = await AuthAPI.setPassword(password);
                if (data.user) {
                    Auth.setUser(data.user);
                }
                showSuccess('Password saved. You can now login with email and password too.');
                setTimeout(() => {
                    window.location.href = 'catalog.html';
                }, 1500);
            } catch (error) {
                showError(error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Save Password</span> <i class="fas fa-lock"></i>';
            }
        });
    </script>
</body>
</html>
