<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Configurator - AutoVerse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .sketchfab-embed-wrapper {
            width: 100%;
            height: 450px;
            background: var(--gray-100);
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
        }
        .sketchfab-embed-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .config-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .config-btn {
            flex: 1;
            min-width: 120px;
            padding: 1rem 1.5rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            background: white;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .config-btn:hover {
            border-color: var(--primary);
        }
        .config-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        .config-btn h4 {
            margin-bottom: 0.25rem;
            font-size: 1rem;
        }
        .config-btn p {
            font-size: 0.875rem;
            margin: 0;
        }
        .config-btn.active p {
            color: rgba(255,255,255,0.8);
        }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .spec-item {
            background: var(--light);
            padding: 1rem;
            border-radius: var(--radius);
            text-align: center;
        }
        .spec-item i {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .spec-item h5 {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }
        .spec-item p {
            font-weight: 600;
            margin: 0;
        }
        @media (max-width: 768px) {
            .sketchfab-embed-wrapper {
                height: 300px;
            }
            .specs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <i class="fas fa-car-side"></i>
                AutoVerse
            </a>
            
            <div class="navbar-menu">
                <a href="index.html">Home</a>
                <a href="catalog.html" class="active">Catalog</a>
                <a href="admin.html" class="admin-link" style="display: none;">Admin</a>
            </div>

            <div class="navbar-actions">
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" style="display: none;">0</span>
                </a>
                
                <div class="auth-buttons">
                    <a href="login.html" class="btn btn-outline btn-sm">Login</a>
                    <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
                </div>

                <div class="user-menu" style="display: none;">
                    <a href="profile.html" class="btn btn-outline btn-sm">
                        <i class="fas fa-user"></i>
                        Profile
                    </a>
                    <button class="btn btn-sm logout-btn">Logout</button>
                </div>

                <button class="mobile-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    
    <div style="background: var(--gray-100); padding: 1rem 0;">
        <div class="container">
            <nav style="display: flex; gap: 0.5rem; color: var(--gray-500); font-size: 0.875rem;">
                <a href="index.html" style="color: var(--gray-500);">Home</a>
                <span>/</span>
                <a href="catalog.html" style="color: var(--gray-500);">Catalog</a>
                <span>/</span>
                <span id="breadcrumb-title" style="color: var(--dark);">3D Configurator</span>
            </nav>
        </div>
    </div>

    
    <main class="car-detail">
        <div class="container">
            <div id="car-content">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </main>

    
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 AutoVerse v2.0. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const carId = urlParams.get('id');

        let currentCar = null;
        let configs = [];
        let selectedConfig = null;

        function getEmbedHtml(config) {
            const html = config?.sketchfabEmbedHtml;
            if (html && html.trim()) return html;
            return `
                <div class="alert alert-danger" style="margin: 1rem;">
                    <i class="fas fa-exclamation-circle"></i>
                    Embed HTML is missing for this configuration.
                </div>
            `;
        }

        async function loadCarDetails() {
            const container = document.getElementById('car-content');
            const breadcrumb = document.getElementById('breadcrumb-title');

            if (!carId) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle"></i>
                        No car ID provided. <a href="catalog.html">Go back to catalog</a>
                    </div>
                `;
                return;
            }

            try {
                const [car, carConfigs] = await Promise.all([
                    CarsAPI.getById(carId),
                    CarsAPI.getConfigs(carId)
                ]);

                currentCar = car;
                configs = carConfigs;
                selectedConfig = configs[0];

                breadcrumb.textContent = `${car.brand} ${car.model}`;
                document.title = `${car.brand} ${car.model} - 3D Configurator | AutoVerse`;

                renderCarPage();
                
            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle"></i>
                        ${error.message || 'Failed to load car details.'}
                        <a href="catalog.html">Go back to catalog</a>
                    </div>
                `;
            }
        }

        function renderCarPage() {
            const container = document.getElementById('car-content');
            const viewerHtml = getEmbedHtml(selectedConfig);

            container.innerHTML = `
                <div class="car-detail-grid">
                    
                    <div>
                        <div class="sketchfab-embed-wrapper" id="sketchfab-container">
                            ${viewerHtml}
                        </div>
                        <p class="text-center text-gray mt-2">
                            <i class="fas fa-mouse-pointer"></i> Click and drag to rotate | Scroll to zoom
                        </p>
                    </div>

                    
                    <div class="car-info">
                        <h1>${currentCar.brand} ${currentCar.model}</h1>
                        <p class="year">${currentCar.year}</p>

                        
                        <h4 style="margin: 1.5rem 0 1rem;">
                            <i class="fas fa-sliders-h"></i> Choose Configuration
                        </h4>
                        <div class="config-buttons" id="config-buttons">
                            ${configs.map((config, index) => `
                                <button class="config-btn ${index === 0 ? 'active' : ''}" data-index="${index}">
                                    <h4>${config.name}</h4>
                                    <p>${UI.formatPrice(config.priceTotal)}</p>
                                </button>
                            `).join('')}
                        </div>

                        
                        <div id="config-specs">
                            ${renderSpecs(selectedConfig)}
                        </div>

                        
                        <div style="background: var(--light); padding: 1.5rem; border-radius: var(--radius-lg); margin: 2rem 0;">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="text-gray" style="margin-bottom: 0.25rem;">Selected: <strong id="selected-config-name">${selectedConfig.name}</strong></p>
                                    <p class="price" id="total-price" style="font-size: 2rem; font-weight: 700; color: var(--primary); margin: 0;">
                                        ${UI.formatPrice(selectedConfig.priceTotal)}
                                    </p>
                                </div>
                            </div>
                        </div>

                        
                        <div class="flex gap-2">
                            <button class="btn btn-primary btn-lg" id="add-to-cart-btn" style="flex: 1;">
                                <i class="fas fa-cart-plus"></i>
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            `;

            setupConfigButtons();
            setupAddToCart();
        }

        function renderSpecs(config) {
            return `
                <div class="specs-grid">
                    <div class="spec-item">
                        <i class="fas fa-cog"></i>
                        <h5>Engine</h5>
                        <p>${config.specs.engine}</p>
                    </div>
                    <div class="spec-item">
                        <i class="fas fa-palette"></i>
                        <h5>Color</h5>
                        <p>${config.specs.color}</p>
                    </div>
                    <div class="spec-item">
                        <i class="fas fa-couch"></i>
                        <h5>Interior</h5>
                        <p>${config.specs.interior}</p>
                    </div>
                </div>
            `;
        }

        function setupConfigButtons() {
            document.querySelectorAll('.config-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = parseInt(btn.dataset.index);
                    selectedConfig = configs[index];

                    document.querySelectorAll('.config-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const container = document.getElementById('sketchfab-container');
                    container.innerHTML = getEmbedHtml(selectedConfig);

                    document.getElementById('config-specs').innerHTML = renderSpecs(selectedConfig);

                    document.getElementById('total-price').textContent = UI.formatPrice(selectedConfig.priceTotal);
                    document.getElementById('selected-config-name').textContent = selectedConfig.name;
                });
            });
        }

        function setupAddToCart() {
            document.getElementById('add-to-cart-btn').addEventListener('click', async () => {
                if (!Auth.isLoggedIn()) {
                    window.location.href = 'login.html';
                    return;
                }

                try {
                    await CartAPI.addItem(carId, selectedConfig._id);
                    UI.showToast(`${currentCar.brand} ${currentCar.model} (${selectedConfig.name}) added to cart!`, 'success');
                    UI.updateCartBadge();
                } catch (error) {
                    UI.showToast(error.message, 'error');
                }
            });
        }

        loadCarDetails();
    </script>
</body>
</html>
