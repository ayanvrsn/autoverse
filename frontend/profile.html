<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - AutoVerse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <i class="fas fa-car-side"></i>
                AutoVerse
            </a>
            
            <div class="navbar-menu">
                <a href="index.html">Home</a>
                <a href="catalog.html">Catalog</a>
                <a href="admin.html" class="admin-link" style="display: none;">Admin</a>
            </div>

            <div class="navbar-actions">
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" style="display: none;">0</span>
                </a>
                
                <div class="user-menu">
                    <a href="profile.html" class="btn btn-outline btn-sm" style="border-color: var(--primary); color: var(--primary);">
                        <i class="fas fa-user"></i>
                        Profile
                    </a>
                    <button class="btn btn-sm logout-btn">Logout</button>
                </div>

                <button class="mobile-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    
    <main class="profile-page">
        <div class="container">
            
            <div class="profile-header">
                <div class="profile-avatar" id="user-avatar">U</div>
                <div class="profile-info">
                    <h2 id="user-email">Loading...</h2>
                    <p id="user-role">Member</p>
                </div>
            </div>

            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <div class="stat-info">
                        <h4 id="cart-items-count">0</h4>
                        <p>Items in Cart</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <div class="stat-info">
                        <h4 id="orders-count">0</h4>
                        <p>Orders</p>
                    </div>
                </div>
            </div>

            
            <div class="table-container mt-4">
                <div class="table-header">
                    <h3>My Orders</h3>
                </div>
                <div id="orders-table">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 AutoVerse v2.0. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        function loadUserInfo() {
            const user = Auth.getUser();
            if (user) {
                const email = user.email || 'User';
                document.getElementById('user-email').textContent = email;
                document.getElementById('user-avatar').textContent = email.charAt(0).toUpperCase();
                document.getElementById('user-role').textContent = user.role === 'ADMIN' ? 'Administrator' : 'Member';
            }
        }

        async function loadCartCount() {
            try {
                const cart = await CartAPI.get();
                const count = cart.items ? cart.items.length : 0;
                document.getElementById('cart-items-count').textContent = count;
            } catch (e) {
                document.getElementById('cart-items-count').textContent = '0';
            }
        }

        async function loadOrders() {
            const container = document.getElementById('orders-table');
            
            try {
                const orders = await OrdersAPI.getAll();
                document.getElementById('orders-count').textContent = orders.length;

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div style="padding: 3rem; text-align: center; color: var(--gray-500);">
                            <i class="fas fa-receipt fa-2x mb-2"></i>
                            <p>No orders yet</p>
                            <a href="catalog.html" class="btn btn-primary btn-sm mt-2">Start Shopping</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Items</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${orders.map(order => `
                                    <tr>
                                        <td><code>${order._id.slice(-8)}</code></td>
                                        <td>${UI.renderOrderItems(order.items)}</td>
                                        <td><strong>${UI.formatPrice(order.totalAmount)}</strong></td>
                                        <td>
                                            <span class="badge badge-${getStatusColor(order.status)}">
                                                ${order.status}
                                            </span>
                                        </td>
                                        <td>${new Date(order.createdAt).toLocaleDateString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger" style="margin: 1rem;">
                        Failed to load orders
                    </div>
                `;
            }
        }

        function getStatusColor(status) {
            switch (status) {
                case 'pending': return 'warning';
                case 'confirmed': return 'primary';
                case 'shipped': return 'primary';
                case 'delivered': return 'success';
                case 'cancelled': return 'danger';
                default: return 'primary';
            }
        }

        loadUserInfo();
        loadCartCount();
        loadOrders();
    </script>
</body>
</html>
