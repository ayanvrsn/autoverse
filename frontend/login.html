<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoVerse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="form-container">
            <a href="index.html" class="auth-logo">
                <i class="fas fa-car-side"></i>
                AutoVerse
            </a>
            
            <div class="form-card">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your account to continue</p>
                </div>

                <div id="error-message" class="alert alert-danger hidden">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-divider">or</div>

                <button type="button" class="btn btn-outline btn-block btn-lg btn-google" id="google-login-btn">
                    <i class="fab fa-google"></i>
                    <span>Continue with Google</span>
                </button>

                <div class="form-footer">
                    Don't have an account? <a href="signup.html">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');
        const loginBtn = document.getElementById('login-btn');
        const googleBtn = document.getElementById('google-login-btn');

        function redirectByRole() {
            if (Auth.isAdmin()) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'catalog.html';
            }
        }

        function showError(message) {
            errorDiv.querySelector('span').textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function parseOAuthParams() {
            const queryParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            return { queryParams, hashParams };
        }

        async function handleOAuthRedirectIfPresent() {
            const { queryParams, hashParams } = parseOAuthParams();
            const token = hashParams.get('token');
            const oauthError = queryParams.get('error');

            if (oauthError) {
                const errorMap = {
                    google_not_configured: 'Google login is not configured on this server yet.',
                    google_auth_failed: 'Google authentication failed. Please try again.',
                    google_profile_incomplete: 'Google account has no email access. Use another Google account.',
                    google_account_conflict: 'This email is already linked to another Google account.',
                    google_login_failed: 'Could not complete Google login. Please try again.'
                };
                showError(errorMap[oauthError] || 'Google login error. Please try again.');
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (!token) return false;

            try {
                Auth.setToken(token);
                const me = await AuthAPI.getMe();
                Auth.setUser(me);
            } catch (error) {
                Auth.removeToken();
                showError('Failed to finish Google login. Please try again.');
                window.history.replaceState({}, document.title, window.location.pathname);
                return true;
            }

            const isNewUser = hashParams.get('isNewUser') === '1';
            const needsPassword = hashParams.get('needsPassword') === '1';

            window.history.replaceState({}, document.title, window.location.pathname);

            if (isNewUser && needsPassword) {
                window.location.href = 'set-password.html';
                return true;
            }

            redirectByRole();
            return true;
        }

        (async () => {
            const wasOAuthHandled = await handleOAuthRedirectIfPresent();
            if (!wasOAuthHandled && Auth.isLoggedIn()) {
                redirectByRole();
            }
        })();

        googleBtn.addEventListener('click', () => {
            window.location.href = AuthAPI.getGoogleLoginUrl();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            errorDiv.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>Signing in...</span> <i class="fas fa-spinner fa-spin"></i>';

            try {
                await AuthAPI.login(email, password);
                redirectByRole();
            } catch (error) {
                showError(error.message);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Sign In</span> <i class="fas fa-arrow-right"></i>';
            }
        });
    </script>
</body>
</html>
